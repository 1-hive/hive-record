[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hiverecord"
version = "1.0.0.dev0"
description = "One Hive R1+R2: the hive record - an append-only, signed, policy-gated event log behind a single gateway"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "One Hive" }]
dependencies = [
    "hivepin>=1.0.0",
    "jsonschema>=4.21",
    "cryptography>=41",
    "psycopg[binary]>=3.1",
    "starlette>=0.37",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.scripts]
hive = "hiverecord.cli:main"

[project.urls]
Homepage = "https://github.com/1-hive/hive-record"
Specification = "https://github.com/1-hive/hive-record/blob/main/SPEC.md"

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]

[tool.uv.sources]
hivepin = { git = "https://github.com/1-hive/hive-pin" }

[tool.hatch.build.targets.wheel]
packages = ["src/hiverecord"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "hiverecord/_schemas"

[tool.hatch.build.targets.sdist]
include = ["src/hiverecord", "schemas", "policy", "fixtures", "SPEC.md", "README.md", "LICENSE", "docs", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["pg: needs Postgres (rootless Podman)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
